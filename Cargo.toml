[package]
name = "pokagent"
version = "0.2.0"
edition = "2021"
description = "Surcouche de fond d'écran qui montre les sessions et agents Claude Code en pixel art."

[dependencies]
serde_json = "1"
embedded-graphics = "0.8"

[build-dependencies]
embed-resource = "3"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_Media_Audio",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_Time",
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_Security_Cryptography",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
