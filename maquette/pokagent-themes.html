<title>PokAgent Univers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: faux écran 1920×1080 (ton fond d'écran), surcouche agents dans le quart haut-gauche, questions dans le quart bas-droit ; choix d'univers et commandes dessous. */
:root {
  --bg: #12141c;
  --panel: #1b1e2a;
  --line: #2b2f40;
  --fg: #ebe8df;
  --muted: #9b99a6;
  --accent: #d97757;
  --run: #58a8f8;
  --done: #f0c040;
  --fail: #e04848;
  --font-pixel: "Pixelify Sans", "Courier New", monospace;
  --font-body: "Inter", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.55; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 56px; }
.wrap { max-width: 1200px; margin: 0 auto; display: grid; gap: 16px; }
header { display: grid; gap: 4px; }
.eyebrow { font-family: var(--font-pixel); color: var(--accent); letter-spacing: .08em; text-transform: uppercase; font-size: 13px; }
h1 { font-family: var(--font-pixel); font-weight: 600; font-size: clamp(26px, 4vw, 38px); line-height: 1.1; margin: 0; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 78ch; }

.themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.themes button { text-align: left; display: grid; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; color: var(--fg); cursor: pointer; font: inherit; }
.themes button b { font-family: var(--font-pixel); font-weight: 600; font-size: 18px; }
.themes button span { color: var(--muted); font-size: 13px; }
.themes button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.themes button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* faux écran : un fond d'écran quelconque, à garder */
.desk { --k: .5; position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: linear-gradient(#f3b07a 0%, #e9877a 30%, #8a6a9a 62%, #3c4a7a 100%); }
.desk svg.wall { position: absolute; inset: 0; width: 100%; height: 100%; }
.zone { position: absolute; width: 50%; height: 50%; border: 1px dashed #ffffff70; pointer-events: none; z-index: 4; }
.zone.tl { left: 0; top: 0; } .zone.br { right: 0; bottom: 0; }
.zone i { position: absolute; font: normal calc(var(--k) * 22px)/1 var(--font-body); color: #fff; background: #0008; padding: 2px 6px; border-radius: 4px; }
.zone.tl i { right: 6px; bottom: 6px; } .zone.br i { left: 6px; top: 6px; }
.desk.nozone .zone { display: none; }
.icons { position: absolute; right: 1.2%; top: 2%; display: grid; gap: calc(var(--k) * 26px); z-index: 1; }
.icons span { width: calc(var(--k) * 56px); height: calc(var(--k) * 56px); border-radius: 10%; background: #ffffff30; border: 1px solid #ffffff50; }
.widget { position: absolute; left: 0; top: 0; width: 50%; height: 50%; z-index: 2; line-height: 0; }
.widget canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.taskbar { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: calc(var(--k) * 48px); background: #1a1c26d8; display: flex; align-items: center; justify-content: center; gap: calc(var(--k) * 14px); }
.taskbar span { width: calc(var(--k) * 26px); height: calc(var(--k) * 26px); border-radius: 4px; background: #ffffff30; }

/* question : quart bas-droit uniquement */
.popup { position: absolute; z-index: 5; right: 1.5%; bottom: calc(var(--k) * 48px + 2%); width: 46%; display: grid; grid-template-columns: auto 1fr; gap: calc(var(--k) * 16px); align-items: end; animation: slide .45s steps(5) both; }
@keyframes slide { from { transform: translateY(140%); } to { transform: none; } }
.popup canvas { width: calc(var(--k) * 108px); height: calc(var(--k) * 156px); image-rendering: pixelated; }
.dlg { position: relative; min-width: 0; font-family: var(--font-pixel); font-size: calc(var(--k) * 30px); line-height: 1.35; padding: .55em .9em .65em; }
.dlg strong { font-weight: 600; }
.dlg .arrow { position: absolute; right: .6em; bottom: .25em; font-size: .7em; animation: blink .8s steps(2) infinite; text-shadow: none; }
@keyframes blink { 50% { opacity: 0; } }
.dlg .acts { display: flex; gap: .8em; margin-top: .35em; flex-wrap: wrap; }
.dlg button { font: inherit; font-size: .82em; background: none; border: 0; padding: 0 2px; color: inherit; text-shadow: inherit; cursor: pointer; }
.dlg button::before { content: "▶ "; opacity: 0; }
.dlg button:hover::before, .dlg button:focus-visible::before { opacity: 1; }
.dlg button:focus-visible { outline: 2px dashed currentColor; }
.dlg.labo { background: linear-gradient(#ffffff, #f4f4f8); color: #505058; border-radius: 10px; border: 2px solid #585868; box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 5px #d8dce8, 0 10px 30px #0008; text-shadow: 1px 1px 0 #d0d0dc; }
.dlg.labo strong, .dlg.labo .arrow { color: #e05048; }
.dlg.village { background: #fff8e6; color: #6a4a30; border-radius: 24px; box-shadow: 0 0 0 3px #eadbb4, 0 10px 30px #0006; }
.dlg.village strong { color: #e07a30; } .dlg.village .arrow { color: #e07a30; }
.dlg.donjon { background: linear-gradient(#2c2836, #1c1a24); color: #ece2c8; border: 2px solid #c8a050; border-radius: 4px; box-shadow: inset 0 0 0 2px #1c1a24, inset 0 0 0 3px #6a5a38, 0 10px 30px #000a; text-shadow: 1px 1px 0 #000; }
.dlg.donjon strong, .dlg.donjon .arrow { color: #f0c860; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls button, .seg button { font-family: var(--font-pixel); font-size: 15px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.controls button:hover { border-color: var(--accent); }
.controls button:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.controls .q { background: #3a1f1a; border-color: #7a3a2c; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #1a0f0a; }
.spacer { flex: 1; }
label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; }
.stat { font: 12px/1.6 ui-monospace, Consolas, monospace; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .popup, .dlg .arrow { animation: none; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Maquette · PokAgent</div>
    <h1>Trois univers pour tes agents</h1>
    <p>Écran principal 1920×1080. Ton fond d'écran reste en place. Les agents vivent dans le quart haut-gauche (12 salles au plus, les suivantes ne s'affichent pas). Le quart bas-droit ne sert qu'aux questions de Claude.</p>
  </header>

  <div class="themes" role="group" aria-label="Univers">
    <button data-theme="labo" aria-pressed="true"><b>Labo</b><span>Dresseurs de monstres de poche, intérieur façon DS</span></button>

    <button data-theme="donjon"><b>Donjon</b><span>Aventure vue de dessus, chevaliers et torches</span></button>
  </div>

  <div class="desk" id="desk">

      <circle cx="1380" cy="330" r="110" fill="#ffe2a8" opacity=".85"/>
      <path d="M0 720 L260 520 L470 640 L720 430 L980 610 L1220 470 L1500 640 L1720 520 L1920 600 L1920 1080 L0 1080Z" fill="#5a4a78" opacity=".85"/>
      <path d="M0 830 L300 700 L560 790 L860 660 L1140 800 L1420 700 L1700 790 L1920 720 L1920 1080 L0 1080Z" fill="#3a3a62"/>
      <path d="M0 940 L400 860 L800 930 L1200 850 L1600 920 L1920 880 L1920 1080 L0 1080Z" fill="#262a48"/>
    </svg>
    <div class="icons" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="widget"><canvas id="view" width="480" height="270"></canvas></div>
    <div class="zone tl"><i>agents</i></div>
    <div class="zone br"><i>questions</i></div>
    <div class="taskbar" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="popup" id="popup" hidden role="alert">

  <div class="controls">
    <button id="bAgent">+ Agent</button>
    <button id="bSession">+ Session</button>
    <button id="bDone">Terminer un agent</button>
    <button id="bFail">Échec</button>
    <button id="bQ" class="q">Claude a une question</button>
    <span class="spacer"></span>
    <span class="seg" role="group" aria-label="Images par seconde">
      <button data-fps="2">2 im/s</button><button data-fps="8" aria-pressed="true">8 im/s</button><button data-fps="20">20 im/s</button>
    </span>
    <label class="chk"><input type="checkbox" id="zones" checked> Montrer les quarts</label>
    <label class="chk"><input type="checkbox" id="auto" checked> Démo auto</label>
    <label class="chk"><input type="checkbox" id="sound" checked> Son</label>
  </div>
  <div class="stat" id="stat"></div>
</div>

<script>
(() => {
  const RW = 120, RH = 88, COLS = 4, ROWS = 3, NW = 480, NH = 270, CAP = COLS * ROWS;
  const view = document.getElementById('view'), ctx = view.getContext('2d');
  const desk = document.getElementById('desk');

  // ---------- outils ----------
  const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const sh = (h, a) => { const t = a < 0 ? 0 : 255, k = Math.abs(a); return '#' + rgb(h).map(v => Math.round(v + (t - v) * k).toString(16).padStart(2, '0')).join(''); };

  function R(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x, y, w, h); }

  function outline(cv, col) {
    const c = cv.getContext('2d'), { width: w, height: h } = cv;
    const im = c.getImageData(0, 0, w, h), d = im.data, src = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) src[i] = d[i * 4 + 3] > 0 ? 1 : 0;
    const [r, g, b] = rgb(col);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x; if (src[i]) continue;
      if ((x > 0 && src[i - 1]) || (x < w - 1 && src[i + 1]) || (y > 0 && src[i - w]) || (y < h - 1 && src[i + w])) { d[i * 4] = r; d[i * 4 + 1] = g; d[i * 4 + 2] = b; d[i * 4 + 3] = 255; }
    }
    c.putImageData(im, 0, 0);
  }
  const STATUS = { run: '#58a8f8', idle: '#68c8a0', done: '#f0c040', failed: '#e04848' };

  // ---------- personnages ----------
  const SKIN = '#f6c9a0', SKIN_D = '#dca07a', EYE = '#2a2a38', BLUSH = '#f0a8a0', SHOE = '#3a3038';
  function human(P, dir, f, hw) {
    const cv = canvas(18, 26), c = cv.getContext('2d');
    const r = (x, y, w, h, col) => R(c, x + 1, y + 1, w, h, col);
    const capD = sh(P.cap, -.3), capH = sh(P.cap, .35), shD = sh(P.shirt, -.25), shH = sh(P.shirt, .25), paD = sh(P.pants, -.3), hairD = sh(P.hair, -.3);
    const M = '#b8c0cc', MD = '#7a8290', MH = '#eef2f6';
    if (dir === 'down' || dir === 'up') {
      const lU = f === 1 ? 1 : 0, rU = f === 2 ? 1 : 0;
      r(4, 17, 3, 4 - lU, P.pants); r(9, 17, 3, 4 - rU, P.pants); r(6, 17, 1, 4 - lU, paD); r(11, 17, 1, 4 - rU, paD);
      r(4, 21 - lU, 3, 2, SHOE); r(9, 21 - rU, 3, 2, SHOE);
      r(3, 11, 10, 7, P.shirt); r(3, 11, 1, 6, shH); r(11, 11, 2, 7, shD); r(3, 17, 10, 1, shD);
      if (P.coat) { r(3, 17, 10, 2, P.shirt); r(3, 18, 10, 1, shD); r(11, 17, 2, 2, shD); }
      if (dir === 'down') { r(6, 11, 4, 1, '#ffffff'); if (P.coat) { r(7, 12, 2, 4, '#d97757'); r(8, 12, 1, 4, '#b05a40'); } }
      if (hw === 'helm' && dir === 'down') { r(3, 13, 10, 1, '#8a6a40'); r(7, 13, 2, 1, '#e8c060'); }
      const la = f === 1 ? -1 : f === 2 ? 1 : 0;
      r(1, 12 + la, 2, 4, P.shirt); r(1, 15 + la, 2, 1, shD); r(1, 16 + la, 2, 2, SKIN);
      r(13, 12 - la, 2, 4, shD); r(13, 16 - la, 2, 2, SKIN_D);
      r(3, 2, 10, 9, SKIN); r(2, 3, 12, 7, SKIN); r(12, 3, 2, 7, SKIN_D); r(4, 10, 8, 1, SKIN_D);
      if (dir === 'down') {
        r(2, 4, 2, 5, P.hair); r(12, 4, 2, 5, hairD); r(4, 5, 8, 1, hairD);
        r(5, 7, 1, 2, EYE); r(10, 7, 1, 2, EYE); r(4, 9, 1, 1, BLUSH); r(11, 9, 1, 1, BLUSH); r(7, 9, 2, 1, SKIN_D);
      } else { r(2, 3, 12, 7, P.hair); r(3, 9, 10, 1, hairD); r(12, 3, 2, 7, hairD); r(5, 10, 6, 1, SKIN_D); }
      if (hw === 'cap') {
        r(3, 0, 10, 1, P.cap); r(2, 1, 12, 4, P.cap); r(4, 1, 3, 1, capH); r(3, 2, 1, 1, capH); r(12, 1, 2, 4, capD);
        if (dir === 'down') { r(2, 5, 12, 1, capD); r(6, 2, 4, 2, '#ffffff'); r(7, 2, 2, 1, P.cap); } else r(2, 5, 12, 1, P.cap);
      } else if (hw === 'helm') {
        if (dir === 'down') { r(3, 1, 10, 1, M); r(2, 2, 12, 4, M); r(4, 2, 3, 1, MH); r(12, 2, 2, 4, MD); r(2, 6, 12, 1, MD); r(2, 6, 2, 4, M); r(12, 6, 2, 4, MD); }
        else { r(3, 1, 10, 1, M); r(2, 2, 12, 8, M); r(4, 2, 3, 1, MH); r(12, 2, 2, 8, MD); r(3, 9, 10, 1, MD); }
        r(6, 0, 4, 2, P.cap);
      } else {
        if (dir === 'down') { r(3, 0, 10, 1, P.cap); r(2, 1, 12, 4, P.cap); r(4, 1, 3, 1, capH); r(1, 4, 2, 8, P.cap); r(13, 4, 2, 8, capD); }
        else { r(3, 0, 10, 1, P.cap); r(1, 1, 14, 11, P.cap); r(13, 1, 2, 11, capD); r(2, 11, 12, 1, capD); }
      }
    } else {
      if (f === 0) { r(6, 17, 4, 4, P.pants); r(9, 17, 1, 4, paD); r(6, 21, 5, 2, SHOE); }
      else { const a = f === 1; r(4, 17, 3, 4, a ? P.pants : paD); r(9, 17, 3, 4, a ? paD : P.pants); r(3, 21, 4, 2, SHOE); r(9, 21, 4, 2, SHOE); }
      r(4, 11, 8, 7, P.shirt); r(4, 11, 1, 6, shH); r(10, 11, 2, 7, shD); r(4, 17, 8, 1, shD);
      if (P.coat) { r(4, 17, 8, 2, P.shirt); r(4, 18, 8, 1, shD); }
      const ax = f === 1 ? 1 : f === 2 ? -1 : 0;
      r(7 + ax, 12, 3, 4, shD); r(7 + ax, 16, 3, 2, SKIN);
      r(4, 2, 9, 9, SKIN); r(3, 3, 11, 7, SKIN); r(4, 10, 7, 1, SKIN_D);
      r(3, 3, 5, 7, P.hair); r(3, 9, 4, 1, hairD); r(7, 6, 1, 2, SKIN_D);
      r(11, 7, 1, 2, EYE); r(13, 8, 1, 1, SKIN_D); r(11, 9, 1, 1, BLUSH);
      if (hw === 'cap') { r(4, 0, 8, 1, P.cap); r(3, 1, 10, 4, P.cap); r(5, 1, 3, 1, capH); r(3, 4, 4, 1, capD); r(10, 4, 5, 1, P.cap); r(9, 5, 6, 1, capD); }
      else if (hw === 'helm') { r(4, 1, 8, 1, M); r(3, 2, 10, 4, M); r(5, 2, 3, 1, MH); r(3, 6, 4, 4, M); r(3, 9, 4, 1, MD); r(5, 0, 4, 2, P.cap); r(2, 1, 2, 2, P.cap); }
      else { r(4, 0, 8, 1, P.cap); r(3, 1, 10, 4, P.cap); r(5, 1, 3, 1, capH); r(2, 4, 5, 8, P.cap); r(2, 11, 5, 1, capD); }
    }
    outline(cv, '#2b2633'); return cv;
  }
  function animal(P, dir, f) {
    const cv = canvas(18, 26), c = cv.getContext('2d');
    const r = (x, y, w, h, col) => R(c, x + 1, y + 1, w, h, col);
    const fur = P.fur, furD = sh(fur, -.22), furH = sh(fur, .3), mz = P.muzzle || sh(fur, .55), shD = sh(P.shirt, -.25), shH = sh(P.shirt, .25), pink = '#f0a0a8';
    const side = dir === 'right';
    if (!side) { r(4, 19, 3, 3 - (f === 1 ? 1 : 0), furD); r(9, 19, 3, 3 - (f === 2 ? 1 : 0), furD); }
    else if (f === 0) r(6, 19, 4, 3, furD); else { r(4, 19, 3, 3, furD); r(9, 19, 3, 3, furD); }
    r(4, 14, 8, 6, P.shirt); r(4, 14, 1, 5, shH); r(10, 14, 2, 6, shD); r(4, 19, 8, 1, shD);
    if (P.coat && dir === 'down') { r(7, 15, 2, 4, '#d97757'); }
    if (!side) { const la = f === 1 ? -1 : f === 2 ? 1 : 0; r(2, 15 + la, 2, 3, P.shirt); r(2, 18 + la, 2, 1, fur); r(12, 15 - la, 2, 3, shD); r(12, 18 - la, 2, 1, furD); }
    else { const ax = f === 1 ? 1 : f === 2 ? -1 : 0; r(7 + ax, 15, 3, 3, shD); r(7 + ax, 18, 3, 1, fur); }
    for (const ex of side ? [4] : [2, 11]) {
      const inner = dir === 'up' ? furD : pink;
      if (P.ear === 'long') { r(ex, 0, 3, 5, fur); r(ex + 1, 1, 1, 3, inner); }
      else if (P.ear === 'pointy') { r(ex + 1, 0, 1, 1, fur); r(ex, 1, 3, 3, fur); r(ex + 1, 2, 1, 1, inner); }
      else { r(ex, 1, 3, 3, fur); r(ex + 1, 2, 1, 1, inner); }
    }
    r(3, 3, 10, 11, fur); r(2, 4, 12, 9, fur); r(1, 6, 14, 5, fur); r(12, 4, 2, 9, furD); r(3, 13, 10, 1, furD); r(3, 4, 2, 2, furH);
    if (dir === 'down') {
      r(4, 7, 2, 2, EYE); r(10, 7, 2, 2, EYE); r(4, 7, 1, 1, '#ffffff'); r(10, 7, 1, 1, '#ffffff');
      r(6, 9, 4, 3, mz); r(7, 9, 2, 1, '#3a2a2a'); r(7, 11, 2, 1, sh(mz, -.2)); r(3, 10, 2, 1, BLUSH); r(11, 10, 2, 1, BLUSH);
    } else if (dir === 'up') r(3, 11, 10, 2, furD);
    else { r(12, 8, 3, 3, mz); r(14, 8, 1, 1, '#3a2a2a'); r(10, 6, 2, 2, EYE); r(10, 6, 1, 1, '#ffffff'); r(9, 10, 2, 1, BLUSH); r(2, 6, 2, 5, furD); }
    outline(cv, '#3a2a28'); return cv;
  }
  function atlas(build) {
    const A = {};
    for (const d of ['down', 'up', 'right']) A[d] = [0, 1, 2].map(f => build(d, f));
    A.left = A.right.map(s => { const cv = canvas(18, 26), c = cv.getContext('2d'); c.scale(-1, 1); c.drawImage(s, -18, 0); return cv; });
    return A;
  }
  const BUBBLE = (() => {
    const cv = canvas(13, 15), c = cv.getContext('2d');
    R(c, 2, 1, 9, 11, '#ffffff'); R(c, 1, 2, 11, 9, '#ffffff'); R(c, 5, 12, 3, 1, '#ffffff'); R(c, 5, 13, 1, 1, '#ffffff'); R(c, 2, 9, 9, 2, '#e4e6f0');
    R(c, 5, 3, 3, 5, '#e83838'); R(c, 7, 3, 1, 5, '#a82020'); R(c, 5, 9, 3, 2, '#e83838'); R(c, 7, 9, 1, 2, '#a82020');
    outline(cv, '#2b2633'); return cv;
  })();

  // ---------- univers 1 : Labo (intérieur façon DS) ----------
  const FLOOR = '#c9935c';
  function laboBg(kind, seed) {
    const cv = canvas(RW, RH), c = cv.getContext('2d'), rnd = rng(seed * 7919 + 13), r = (x, y, w, h, col) => R(c, x, y, w, h, col);

      if (mode === 'done') {
        R(c, cx, cy - 5, 14, 5, '#6a4020'); R(c, cx, cy - 5, 14, 1, '#8a5a30');
        R(c, cx, cy, 14, 10, '#8a5a30'); R(c, cx + 1, cy, 12, 3, '#3a2010'); R(c, cx + 2, cy, 10, 2, '#f8d040'); R(c, cx + 3, cy, 2, 1, '#fff4c0');
        if (Math.floor(t * 3) % 2) R(c, cx + 9, cy - 3, 1, 1, '#ffffff');
      } else {
        R(c, cx, cy, 14, 10, '#8a5a30'); R(c, cx, cy - 2, 14, 4, '#a87040'); R(c, cx, cy - 2, 14, 1, '#c8905a');
        R(c, cx + 3, cy - 2, 2, 12, '#b8b8c8'); R(c, cx + 9, cy - 2, 2, 12, '#b8b8c8'); R(c, cx + 6, cy + 2, 2, 2, mode === 'failed' ? '#e04848' : '#f0d070');
      }
    }
  }
  function donjonDoor(c, x, y) { R(c, x - 4, y + 48, 8, 18, SLAB); R(c, x - 4, y + 48, 8, 1, '#1e1c26'); R(c, x - 4, y + 46, 8, 2, '#1e1c26'); }

  const THEMES = {
    labo: { bg: laboBg, status: laboStatus, door: laboDoor, char: (P, d, f) => human(P, d, f, 'cap'), walk: [36, 78, 30, 58], spot: [14, 26], plate: ['rgba(20,16,30,.78)', '#f8f0d8'] },
    village: { bg: villageBg, status: villageStatus, door: villageDoor, char: animal, walk: [10, 80, 36, 58], spot: [47, 14], plate: ['rgba(110,74,40,.9)', '#fff6dc'] },
    donjon: { bg: donjonBg, status: donjonStatus, door: donjonDoor, char: (P, d, f) => human(P, d, f, P.claude ? 'hood' : 'helm'), walk: [46, 80, 30, 58], spot: [53, 22], plate: ['rgba(10,8,14,.85)', '#f0c860'] },
  };
  let theme = 'labo';
  try { const s = localStorage.getItem('pokagent-theme'); if (THEMES[s]) theme = s; } catch (e) {}

  // ---------- état ----------
  const now = () => performance.now() / 1000;
  let sessions = [], uid = 1, pending = [], fps = 8;
  const NAMES = ['explore-api', 'refacto-ui', 'tests-e2e', 'doc-readme', 'fix-watcher', 'build-rust', 'audit-deps', 'sprites-16px', 'port-sse', 'bench-cpu', 'i18n', 'perf-gpu', 'lint', 'release'];
  const QUESTIONS = [
    'Je peux lancer <strong>npm install</strong> dans ce dossier ?',
    'Deux pistes pour le watcher : <strong>notify</strong> ou sondage. Laquelle ?',
    'J\'ai besoin d\'écrire dans <strong>src/themes/</strong>. J\'autorise ?',
    'Le build casse sous Node 20. On passe en <strong>Node 22</strong> ?',
  ];
  const CLAUDE = { claude: true, cap: '#d97757', shirt: '#f4f2ec', pants: '#4a4458', hair: '#5a3a28', coat: true, fur: '#e08850', muzzle: '#fff3e6', ear: 'pointy' };
  const PALS = [
    { cap: '#e24848', shirt: '#3a6fd0', pants: '#3a3f5c', hair: '#3a2a20', fur: '#c8a078', ear: 'round' },
    { cap: '#43a85a', shirt: '#f0c43a', pants: '#4a4050', hair: '#6a4020', fur: '#f2f0ec', muzzle: '#ffe8ec', ear: 'long' },
    { cap: '#8a5ad0', shirt: '#3ab0a6', pants: '#353a55', hair: '#202028', fur: '#9a9aaa', ear: 'pointy' },
    { cap: '#f08a2a', shirt: '#6e7088', pants: '#2e3248', hair: '#8a5a2a', fur: '#e8c070', ear: 'round' },
    { cap: '#e86aa8', shirt: '#2f4a86', pants: '#3a3040', hair: '#c08840', fur: '#f0c0c8', ear: 'long' },
    { cap: '#3a98e0', shirt: '#d85050', pants: '#2e3a4a', hair: '#4a2e1a', fur: '#6a5a50', ear: 'pointy' },
  ];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  // décor et atlas calculés une fois par salle et par univers
  function look(r) {
    if (!r.cache[theme]) { const T = THEMES[theme]; r.cache[theme] = { bg: T.bg(r.kind, r.seed, r.pal), spr: atlas((d, f) => T.char(r.pal, d, f)) }; }
    return r.cache[theme];
  }
  const mkChar = () => { const [x0, x1, y0, y1] = THEMES[theme].walk; return { x: Math.round(rnd(x0, x1)), y: Math.round(rnd(y0, y1)), tx: 60, ty: 50, dir: 'down', dist: 0, wait: rnd(.3, 2) }; };
  function addSession(name) {
    const s = { id: uid++, name, rooms: [] };
    s.rooms.push({ kind: 'hub', name, status: 'running', pal: CLAUDE, seed: uid, cache: {}, ch: mkChar(), born: now() });
    sessions.push(s); return s;
  }
  function addAgent(s) {
    s = s || pick(sessions);
    if (!s) return null;
    const used = new Set(sessions.flatMap(x => x.rooms.map(r => r.name)));
    const v = uid++;
    const r = { kind: 'agent', name: NAMES.find(n => !used.has(n)) || 'agent-' + v, status: 'running', pal: PALS[v % PALS.length], seed: v, cache: {}, ch: mkChar(), born: now(), q: null, ended: 0 };
    s.rooms.push(r); return r;
  }
  const agents = st => sessions.flatMap(s => s.rooms.filter(r => r.kind === 'agent' && (!st || r.status === st)).map(r => ({ s, r })));
  const modeOf = (r, s) => r.kind === 'hub' ? (s.rooms.some(x => x.kind === 'agent' && x.status === 'running') ? 'run' : 'idle') : (r.status === 'running' ? 'run' : r.status);

  // ---------- son ----------
  let actx = null;
  function beep() {
    if (!document.getElementById('sound').checked) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state !== 'running') return;
      const seq = { labo: [[1318.5, 0], [1975.5, .09], [1975.5, .2]], village: [[784, 0], [988, .1], [1175, .2], [1568, .3]], donjon: [[523, 0], [659, .1], [784, .2], [1046, .32]] }[theme];
      for (const [f, t] of seq) {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = theme === 'village' ? 'triangle' : 'square'; o.frequency.value = f;
        g.gain.setValueAtTime(theme === 'village' ? .12 : .05, actx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + t + .1);
        o.connect(g).connect(actx.destination); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + .11);
      }
    } catch (e) {}
  }
  function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {} }

  // ---------- questions ----------
  const popup = document.getElementById('popup'), dlg = document.getElementById('dlg');
  const portrait = document.getElementById('portrait').getContext('2d');
  function ask(target) {
    const list = agents('running').filter(a => !a.r.q);
    const t = target || (list.length ? pick(list) : null);
    if (!t) return;
    t.r.q = pick(QUESTIONS); pending.push(t);
    if (pending.length === 1) showPopup(true);
    beep();
  }
  function showPopup(anim) {
    const t = pending[0];
    if (!t) { popup.hidden = true; return; }
    portrait.clearRect(0, 0, 18, 26); portrait.drawImage(look(t.r).spr.down[0], 0, 0);
    document.getElementById('qtext').innerHTML = `<strong>${t.r.name.toUpperCase()}</strong> · ${t.s.name}<br>${t.r.q}`;
    popup.hidden = false;
    if (anim) { popup.style.animation = 'none'; void popup.offsetWidth; popup.style.animation = ''; }
  }
  function closeQ() { const t = pending.shift(); if (t) t.r.q = null; showPopup(true); }
  document.getElementById('qopen').onclick = closeQ;
  document.getElementById('qlater').onclick = () => { if (pending.length > 1) { pending.push(pending.shift()); showPopup(true); } else popup.hidden = true; };

  // ---------- simulation ----------
  function update(dt) {
    const t = now(), T = THEMES[theme], [x0, x1, y0, y1] = T.walk, [sx, sy] = T.spot;
    for (const s of sessions) for (const r of s.rooms) {
      const c = r.ch;
      if (r.q || (r.kind === 'agent' && r.status !== 'running')) { c.dir = 'down'; c.wait = .5; continue; }
      if (c.wait > 0) { c.wait -= dt; continue; }
      const dx = c.tx - c.x, dy = c.ty - c.y, step = 24 * dt;
      if (Math.abs(dx) > .5) { const m = Math.sign(dx) * Math.min(Math.abs(dx), step); c.x += m; c.dist += Math.abs(m); c.dir = dx > 0 ? 'right' : 'left'; }
      else if (Math.abs(dy) > .5) { const m = Math.sign(dy) * Math.min(Math.abs(dy), step); c.y += m; c.dist += Math.abs(m); c.dir = dy > 0 ? 'down' : 'up'; }
      else {
        if (c.tx === sx && c.ty === sy) c.dir = 'up';
        c.wait = rnd(1, 3.5);
        if (Math.random() < .3) { c.tx = sx; c.ty = sy; } else { c.tx = Math.round(rnd(x0, x1)); c.ty = Math.round(rnd(y0, y1)); }
      }
    }
    for (const s of sessions) s.rooms = s.rooms.filter(r => !(r.kind === 'agent' && r.status !== 'running' && t - r.ended > 25));
  }

  // ---------- rendu : fond transparent, 12 salles au plus dans le quart ----------
  function draw() {
    const T = THEMES[theme], t = now(), blinkOn = Math.floor(t * 2) % 2 === 0;
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, NW, NH);
    ctx.font = '8px Silkscreen';
    const all = sessions.flatMap(s => s.rooms.map(r => ({ s, r })));
    const vis = all.slice(0, CAP), hidden = all.length - vis.length;
    const pos = i => [(i % COLS) * RW, Math.floor(i / COLS) * RH];
    vis.forEach(({ s, r }, i) => { const [x, y] = pos(i); ctx.drawImage(look(r).bg, x, y); T.status(ctx, modeOf(r, s), x, y, t, r.kind, r.seed); });
    vis.forEach(({ s }, i) => { const n = vis[i + 1]; if (n && n.s === s && (i + 1) % COLS) { const [x, y] = pos(i); T.door(ctx, x + RW, y); } });
    vis.forEach(({ s, r }, i) => {
      const [rx, ry] = pos(i), c = r.ch, spr = look(r).spr;
      const still = c.wait > 0 || r.q || (r.kind === 'agent' && r.status !== 'running');
      const f = still ? 0 : [1, 0, 2, 0][Math.floor(c.dist / 5) % 4];
      const x = rx + Math.round(c.x) - 1, y = ry + Math.round(c.y) - 1 - (f ? 1 : 0), fy = ry + Math.round(c.y) + 21;
      R(ctx, x + 4, fy, 10, 3, 'rgba(20,10,10,.28)'); R(ctx, x + 3, fy + 1, 12, 1, 'rgba(20,10,10,.28)');
      ctx.drawImage(spr[c.dir][f], x, y);
      if (r.q && blinkOn) ctx.drawImage(BUBBLE, x + 3, y - 15);
      const label = r.kind === 'hub' ? 'CLAUDE · ' + s.name : r.name, tw = Math.ceil(ctx.measureText(label).width);
      R(ctx, rx + 5, ry + RH - 14, tw + 7, 10, T.plate[0]); R(ctx, rx + 5, ry + RH - 14, tw + 7, 1, 'rgba(255,255,255,.15)');
      ctx.fillStyle = T.plate[1]; ctx.fillText(label, rx + 9, ry + RH - 6);
      const age = t - r.born;
      if (age < .6) R(ctx, rx, ry, RW, RH, `rgba(8,8,16,${1 - Math.floor(age / .15) * .25})`);
    });
    if (hidden > 0) {
      const [x, y] = pos(CAP - 1), txt = `+${hidden} hors cadre`, tw = Math.ceil(ctx.measureText(txt).width);
      R(ctx, x + RW - tw - 12, y + 4, tw + 8, 10, '#e04848'); ctx.fillStyle = '#ffffff'; ctx.fillText(txt, x + RW - tw - 8, y + 12);
    }
    document.getElementById('stat').textContent = `surcouche ${NW}×${NH} px natifs, affichée ×2 (960×540 à l'écran) · ${fps} im/s · ${vis.length}/${CAP} salles${hidden ? ` · ${hidden} non affichée(s)` : ''}`;
  }
  let last = now();
  function tick() {
    const t = now(), dt = Math.min(.5, t - last); last = t;
    if (!document.hidden) { update(dt); draw(); }
    setTimeout(tick, 1000 / fps);
  }
  const fitK = () => desk.style.setProperty('--k', String(desk.clientWidth / 1920));
  window.addEventListener('resize', fitK);

  // ---------- commandes ----------
  function setTheme(id) {
    theme = id;
    try { localStorage.setItem('pokagent-theme', id); } catch (e) {}
    document.querySelectorAll('.themes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === id)));
    dlg.className = 'dlg ' + id;
    if (!popup.hidden) showPopup(false);
  }
  document.querySelectorAll('.themes button').forEach(b => b.onclick = () => setTheme(b.dataset.theme));
  function finish(st) { const l = agents('running').filter(a => !a.r.q); if (!l.length) return; const a = pick(l); a.r.status = st; a.r.ended = now(); }
  function autoEvent() {
    if (!document.getElementById('auto').checked || document.hidden) return;
    const n = agents().length, x = Math.random();
    if (x < .4 && n < 12) addAgent();
    else if (x < .62) finish('done');
    else if (x < .7) finish('failed');
    else if (x < .84 && pending.length === 0) ask();
    else if (x < .9 && sessions.length < 3) { const s = addSession(['MyLife', 'PokAgent', 'ClaudeIsles'].find(nm => !sessions.some(s => s.name === nm)) || 'Projet'); addAgent(s); }
  }
  document.getElementById('bAgent').onclick = () => addAgent();
  document.getElementById('bSession').onclick = () => { if (sessions.length < 5) addSession(['MyLife', 'Cap', 'Notes', 'Projet', 'Perso'].find(nm => !sessions.some(s => s.name === nm)) || 'Projet'); };
  document.getElementById('bDone').onclick = () => finish('done');
  document.getElementById('bFail').onclick = () => finish('failed');
  document.getElementById('bQ').onclick = () => { unlockAudio(); setTimeout(() => ask(), 30); };
  document.getElementById('zones').onchange = e => desk.classList.toggle('nozone', !e.target.checked);
  document.addEventListener('pointerdown', unlockAudio, { once: true });
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { fps = +b.dataset.fps; document.querySelectorAll('.seg button').forEach(o => o.setAttribute('aria-pressed', String(o === b))); });

  const s1 = addSession('ClaudeIsles');
  addAgent(s1); const d = addAgent(s1); d.status = 'done'; d.ended = now();
  const s2 = addSession('PokAgent'); addAgent(s2); addAgent(s2);
  for (const s of sessions) for (const r of s.rooms) r.born = -10;
  setTheme(theme); fitK();
  const start = () => { tick(); setInterval(autoEvent, 3500); setTimeout(() => ask(agents('running')[0]), 2500); };
  (document.fonts && document.fonts.load ? document.fonts.load('8px Silkscreen').catch(() => {}) : Promise.resolve()).then(start);
})();
</script>
